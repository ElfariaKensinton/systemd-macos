name: Build and Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the build as a GitHub Release"
        required: true
        default: false
        type: boolean
      version:
        description: "Base semantic version (for example 0.1.0)"
        required: true
        default: "0.1.0"
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          rm -rf dist stage
          mkdir -p dist stage/bin stage/scripts
          install -m 755 .build/release/systemd stage/bin/systemd
          install -m 755 .build/release/systemctl stage/bin/systemctl
          install -m 755 .build/release/journalctl stage/bin/journalctl
          install -m 755 .build/release/systemd-exec-helper stage/bin/systemd-exec-helper
          install -m 644 scripts/systemd-macos.bash stage/scripts/systemd-macos.bash
          install -m 644 scripts/_systemctl stage/scripts/_systemctl
          install -m 644 scripts/_journalctl stage/scripts/_journalctl
          tar -C stage -czf "dist/systemd-macos-${ARCH}.tar.gz" .
          shasum -a 256 "dist/systemd-macos-${ARCH}.tar.gz" > "dist/systemd-macos-${ARCH}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: systemd-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: systemd-macos-*
          merge-multiple: true

      - name: Generate release identity
        id: release
        env:
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y%m%d)"
          TAG="v${VERSION}-build.${DATE}.${RUN_NUMBER}"
          TITLE="systemd-macos ${VERSION} — Build ${RUN_NUMBER} (${DATE})"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            gh release create "$TAG" \
              dist/systemd-macos-arm64.tar.gz \
              dist/systemd-macos-arm64.tar.gz.sha256 \
              dist/systemd-macos-x86_64.tar.gz \
              dist/systemd-macos-x86_64.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes \
              --prerelease
          else
            gh release create "$TAG" \
              dist/systemd-macos-arm64.tar.gz \
              dist/systemd-macos-arm64.tar.gz.sha256 \
              dist/systemd-macos-x86_64.tar.gz \
              dist/systemd-macos-x86_64.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes
          fi

      - name: Print installation command
        run: |
          echo "Install latest release with:"
          echo "curl -fsSL https://raw.githubusercontent.com/ElfariaKensinton/systemd-macos/main/scripts/install.sh | bash"
